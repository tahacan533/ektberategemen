\"w-12 h-12 text-emerald-400 mx-auto\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M5 13l4 4L19 7\"><\/path><\/svg>\n                <\/div>\n                <h3 class=\"text-2xl font-black font-arcade text-emerald-400 mb-2\">QUIZ COMPLETED!<\/h3>\n                <p id=\"quizRewardSummary\" class=\"text-slate-300 mb-6 text-sm\">Correct answers rewarded with +500 Score & Full Turbo Energy!<\/p>\n                <button id=\"resumeGameBtn\" class=\"w-full py-3 rounded-2xl btn-quiz text-white font-black font-arcade text-base tracking-wider shadow-lg\">CONTINUE GAME<\/button>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <!-- Game Over Modal -->\n    <div id=\"gameOverScreen\" class=\"absolute inset-0 flex items-center justify-center z-20 bg-slate-950/85 backdrop-blur-md hidden\">\n        <div class=\"hud-panel p-10 rounded-3xl max-w-md w-full text-center shadow-2xl border border-red-500/30 mx-4\">\n            <div class=\"inline-block p-4 bg-red-500/10 rounded-2xl mb-4 border border-red-500/20\">\n                <svg class=\"w-12 h-12 text-red-500 mx-auto\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                    <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z\"><\/path>\n                <\/svg>\n            <\/div>\n            <h2 class=\"text-3xl font-black font-arcade text-red-500 mb-1 tracking-wider\">CRASH!<\/h2>\n            <p class=\"text-slate-400 mb-6 text-sm\">Collision detected on highway.<\/p>\n            \n            <div class=\"grid grid-cols-2 gap-4 mb-8\">\n                <div class=\"bg-slate-900/60 p-4 rounded-2xl border border-white/5\">\n                    <p class=\"text-xs text-slate-400 font-arcade uppercase\">Final Score<\/p>\n                    <p id=\"finalScore\" class=\"text-2xl font-black font-arcade text-blue-400 mt-1\">0<\/p>\n                <\/div>\n                <div class=\"bg-slate-900/60 p-4 rounded-2xl border border-white/5\">\n                    <p class=\"text-xs text-slate-400 font-arcade uppercase\">Best Score<\/p>\n                    <p id=\"finalHighScore\" class=\"text-2xl font-black font-arcade text-amber-400 mt-1\">0<\/p>\n                <\/div>\n            <\/div>\n\n            <button id=\"restartBtn\" class=\"w-full py-4 rounded-2xl btn-arcade text-white font-black font-arcade text-lg tracking-wider shadow-lg flex items-center justify-center space-x-2\">\n                <span>PLAY AGAIN<\/span>\n                <svg class=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15\"><\/path><\/svg>\n            <\/button>\n        <\/div>\n    <\/div>\n\n    <script>\n        let scene, camera, renderer;\n        let playerCar;\n        let obstacles = [];\n        let sceneryObjects = [];\n        let roadLines = [];\n        let particleSystem;\n        \n        let gameState = 'MENU'; // MENU, PLAYING, QUIZ, GAMEOVER\n        let score = 0;\n        let highScore = localStorage.getItem('highway_highscore_divided_v3') || 0;\n        let distanceTraveled = 0;\n        \n        // Balanced speed setup\n        let gameSpeed = 0.45;\n        let baseSpeed = 0.45;\n        let minSpeed = 0.25;\n        let maxSpeed = 1.15;\n        let turboSpeed = 1.65;\n        \n        let isTurboActive = false;\n        let isBraking = false;\n        let turboEnergy = 100;\n        \n        // 4 Lanes X coordinates configuration (Road width 16 units)\n        // Lanes: 0 & 1 (Left side) = Oncoming traffic (moving down towards player)\n        // Lanes: 2 & 3 (Right side) = Same direction traffic (moving forward)\n        const lanes = [-4.8, -1.6, 1.6, 4.8];\n        let targetLaneIndex = 2; // Player starts on lane 2 (right side going forward)\n        let playerCurrentX = lanes[targetLaneIndex];\n        \n        const keys = { left: false, right: false, turbo: false, brake: false };\n        let obstacleSpawnTimer = 0;\n        let quizTriggerDistance = 0;\n        let audioCtx = null;\n\n        // Educational Traffic Rules Quiz Questions (Turkish)\n        const quizQuestions = [\n            {\n                question: \"Aksine bir işaret yoksa, yerleşim yeri dışındaki iki yönlü karayollarında otomobiller için azami hız sınırı saatte kaç kilometredir?\",\n                options: [\"A) 70 km/s\", \"B) 90 km/s\", \"C) 110 km/s\", \"D) 120 km/s\"],\n                correct: 1\n            },\n            {\n                question: \"Önünüzdeki aracı takip ederken aradaki güvenli mesafe (takip mesafesi), aracın hızının kaçta biri kadardır?\",\n                options: [\"A) Yarısı (1/2)\", \"B) Tamamı (1/1)\", \"C) Üçte biri\", \"D) Dörtte biri\"],\n                correct: 0\n            },\n            {\n                question: \"Kırmızı ışıkta geçen bir sürücü hangi trafik kuralını ihlal etmiş olur ve ne anlam taşır?\",\n                options: [\"A) Dikkatli geç\", \"B) Mutlak durma ve geçiş yasağı\", \"C) Yol ver\", \"D) Hızlan\"],\n                correct: 1\n            },\n            {\n                question: \"Aksine bir işaret yoksa, yerleşim yeri içindeki iki yönlü karayollarında otomobiller için azami hız sınırı nedir?\",\n                options: [\"A) 30 km/s\", \"B) 50 km/s\", \"C) 70 km/s\", \"D) 90 km/s\"],\n                correct: 1\n            },\n            {\n                question: \"Gece sürüşünde karşı yönden gelen araçlar yaklaştığında sürücülerin hangi ışıkları yakması zorunludur?\",\n                options: [\"A) Uzun hüzmeli farlar\", \"B) Kısa hüzmeli farlar (Uzaklığı azalt)\", \"C) Sis farları\", \"D) Dörtlü flaşörler\"],\n                correct: 1\n            }\n        ];\n        let currentQuestionIndex = 0;\n        let quizActiveGamePausedState = 'PLAYING';\n\n        document.getElementById('highScoreDisplay').innerText = highScore;\n\n        function initAudio() {\n            if (!audioCtx) {\n                audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            }\n            if (audioCtx.state === 'suspended') {\n                audioCtx.resume();\n            }\n        }\n\n        function playCrashSound() {\n            if (!audioCtx) return;\n            try {\n                const osc = audioCtx.createOscillator();\n                const gain = audioCtx.createGain();\n                osc.type = 'sawtooth';\n                osc.frequency.setValueAtTime(120, audioCtx.currentTime);\n                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);\n                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);\n                osc.connect(gain);\n                gain.connect(audioCtx.destination);\n                osc.start();\n                osc.stop(audioCtx.currentTime + 0.4);\n            } catch(e) {}\n        }\n\n        function playLaneChangeSound() {\n            if (!audioCtx) return;\n            try {\n                const osc = audioCtx.createOscillator();\n                const gain = audioCtx.createGain();\n                osc.type = 'sine';\n                osc.frequency.setValueAtTime(350, audioCtx.currentTime);\n                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);\n                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);\n                osc.connect(gain);\n                gain.connect(audioCtx.destination);\n                osc.start();\n                osc.stop(audioCtx.currentTime + 0.08);\n            } catch(e) {}\n        }\n\n        function playCorrectSound() {\n            if (!audioCtx) return;\n            try {\n                const osc = audioCtx.createOscillator();\n                const gain = audioCtx.createGain();\n                osc.type = 'triangle';\n                osc.frequency.setValueAtTime(440, audioCtx.currentTime);\n                osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.1);\n                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);\n                osc.connect(gain);\n                gain.connect(audioCtx.destination);\n                osc.start();\n                osc.stop(audioCtx.currentTime + 0.3);\n            } catch(e) {}\n        }\n\n        function initThree() {\n            scene = new THREE.Scene();\n            scene.background = new THREE.Color(0x050814);\n            scene.fog = new THREE.FogExp2(0x050814, 0.012);\n\n            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);\n            camera.position.set(0, 5.8, 12);\n            camera.lookAt(0, 0.8, -4);\n\n            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: \"high-performance\" });\n            renderer.setSize(window.innerWidth, window.innerHeight);\n            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n            renderer.shadowMap.enabled = true;\n            renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n            document.getElementById('canvas-container').appendChild(renderer.domElement);\n\n            // Lighting\n            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);\n            scene.add(ambientLight);\n\n            const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.2);\n            dirLight.position.set(25, 45, 25);\n            dirLight.castShadow = true;\n            dirLight.shadow.mapSize.width = 2048;\n            dirLight.shadow.mapSize.height = 2048;\n            dirLight.shadow.camera.near = 0.5;\n            dirLight.shadow.camera.far = 150;\n            const d = 35;\n            dirLight.shadow.camera.left = -d;\n            dirLight.shadow.camera.right = d;\n            dirLight.shadow.camera.top = d;\n            dirLight.shadow.camera.bottom = -d;\n            scene.add(dirLight);\n\n            const hemiLight = new THREE.HemisphereLight(0x38bdf8, 0x1e1b4b, 0.5);\n            scene.add(hemiLight);\n\n            buildEnvironment();\n            createPlayerCar();\n            createParticleSystem();\n\n            window.addEventListener('resize', onWindowResize);\n            setupInputListeners();\n        }\n\n        function buildEnvironment() {\n            // Asphalt Road (16 units wide for 4 lanes)\n            const roadGeometry = new THREE.PlaneGeometry(16, 1200);\n            const roadMaterial = new THREE.MeshStandardMaterial({ \n                color: 0x111827,\n                roughness: 0.8,\n                metalness: 0.2\n            });\n            const road = new THREE.Mesh(roadGeometry, roadMaterial);\n            road.rotation.x = -Math.PI / 2;\n            road.position.z = -500;\n            road.receiveShadow = true;\n            scene.add(road);\n\n            // Side shoulders / terrain\n            const shoulderGeometry = new THREE.PlaneGeometry(120, 1200);\n            const shoulderMaterial = new THREE.MeshStandardMaterial({ color: 0x060913, roughness: 0.95 });\n            const leftShoulder = new THREE.Mesh(shoulderGeometry, shoulderMaterial);\n            leftShoulder.rotation.x = -Math.PI / 2;\n            leftShoulder.position.set(-68, -0.05, -500);\n            leftShoulder.receiveShadow = true;\n            scene.add(leftShoulder);\n\n            const rightShoulder = new THREE.Mesh(shoulderGeometry, shoulderMaterial);\n            rightShoulder.rotation.x = -Math.PI / 2;\n            rightShoulder.position.set(68, -0.05, -500);\n            rightShoulder.receiveShadow = true;\n            scene.add(rightShoulder);\n\n            // Lane Dividers\n            // Center divider (x = 0) is a solid yellow double line for divided highway\n            for (let i = 0; i < 120; i++) {\n                const yellowGeo = new THREE.BoxGeometry(0.3, 0.05, 3.5);\n                const yellowMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });\n                const yLine1 = new THREE.Mesh(yellowGeo, yellowMat);\n                yLine1.position.set(-0.15, 0.02, -i * 10);\n                scene.add(yLine1);\n                roadLines.push(yLine1);\n\n                const yLine2 = new THREE.Mesh(yellowGeo, yellowMat);\n                yLine2.position.set(0.15, 0.02, -i * 10);\n                scene.add(yLine2);\n                roadLines.push(yLine2);\n            }\n\n            // Outer lane dividers (x = -3.2 and x = 3.2) are white dashed lines\n            [-3.2, 3.2].forEach(posX => {\n                for (let i = 0; i < 120; i++) {\n                    const lineGeo = new THREE.BoxGeometry(0.2, 0.04, 3.5);\n                    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });\n                    const line = new THREE.Mesh(lineGeo, lineMat);\n                    line.position.set(posX, 0.02, -i * 10);\n                    scene.add(line);\n                    roadLines.push(line);\n                }\n            });\n\n            // Roadside neon barriers & trees\n            [-8.5, 8.5].forEach((posX, sideIdx) => {\n                for (let i = 0; i < 60; i++) {\n                    const barrierGeo = new THREE.BoxGeometry(0.3, 0.7, 6);\n                    const barrierMat = new THREE.MeshStandardMaterial({ \n                        color: sideIdx === 0 ? 0xef4444 : 0x3b82f6,\n                        emissive: sideIdx === 0 ? 0xef4444 : 0x3b82f6,\n                        emissiveIntensity: 0.5\n                    });\n                    const barrier = new THREE.Mesh(barrierGeo, barrierMat);\n                    barrier.position.set(posX, 0.35, -i * 20);\n                    barrier.castShadow = true;\n                    scene.add(barrier);\n                    sceneryObjects.push(barrier);\n\n                    const treeGeo = new THREE.ConeGeometry(1.5, 4, 5);\n                    const treeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });\n                    const tree = new THREE.Mesh(treeGeo, treeMat);\n                    tree.position.set(sideIdx === 0 ? -14 : 14, 2, -i * 20 - 5);\n                    tree.castShadow = true;\n                    scene.add(tree);\n                    sceneryObjects.push(tree);\n                }\n            });\n        }\n\n        function buildFerrari458(color) {\n    const g = new THREE.Group(), m = new THREE.Group();\n    g.add(m);\n    const paint = new THREE.MeshStandardMaterial({ color, roughness: 0.2, metalness: 0.65 });\n    const dark = new THREE.MeshStandardMaterial({ color: 0x0b0f14, roughness: 0.45, metalness: 0.5 });\n    const glass = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.05, metalness: 0.9 });\n    const chrome = new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.2, metalness: 0.95 });\n    const extrude = (pts, depth, bevel) => {\n        const sh = new THREE.Shape();\n        pts.forEach((p, i) => i ? sh.lineTo(p[0], p[1]) : sh.moveTo(p[0], p[1]));\n        const geo = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 2 });\n        geo.translate(0, 0, -depth / 2);\n        geo.rotateY(Math.PI / 2); // şekil x'i -> dünya -z (ön = -z)\n        return geo;\n    };\n    const add = (geo, mat, x, y, z, shadow) => {\n        const mesh = new THREE.Mesh(geo, mat);\n        mesh.position.set(x, y, z);\n        if (shadow) mesh.castShadow = true;\n        m.add(mesh);\n        return mesh;\n    };\n    // Gövde (yandan profil, ön = sağ)\n    add(extrude([[-2.25,0.25],[2.2,0.25],[2.25,0.45],[2.0,0.58],[1.3,0.68],[0.7,0.72],[-1.3,0.78],[-1.6,0.9],[-2.2,0.92],[-2.25,0.7]], 1.5, 0.06), paint, 0, 0, 0, true);\n    // Kabin camları + tavan\n    add(extrude([[0.75,0.72],[0.2,1.08],[-0.85,1.1],[-1.4,0.85],[-1.4,0.72]], 1.3, 0.03), glass, 0, 0, 0, true);\n    add(new THREE.BoxGeometry(1.15, 0.04, 0.95), paint, 0, 1.13, 0.3);\n    // Yan hava girişleri (kapı arkası)\n    [-1, 1].forEach(s => {\n        add(new THREE.BoxGeometry(0.05, 0.2, 0.7), dark, s * 0.84, 0.52, 0.95);\n        add(new THREE.BoxGeometry(0.12, 0.07, 0.16), paint, s * 0.88, 0.85, -0.6); // ayna\n    });\n    // Ön ızgara, ön lip, farlar\n    add(new THREE.BoxGeometry(1.1, 0.16, 0.06), dark, 0, 0.38, -2.27);\n    add(new THREE.BoxGeometry(1.7, 0.05, 0.3), dark, 0, 0.26, -2.2);\n    [-1, 1].forEach(s => {\n        const hl = add(new THREE.BoxGeometry(0.5, 0.1, 0.06), new THREE.MeshBasicMaterial({ color: 0xfef9c3 }), s * 0.55, 0.58, -2.15);\n        hl.rotation.y = s * 0.12;\n        // Yuvarlak çift stop lambası\n        const tl = add(new THREE.CylinderGeometry(0.13, 0.13, 0.05, 16), new THREE.MeshBasicMaterial({ color: 0xef1c1c }), s * 0.55, 0.76, 2.28);\n        tl.rotation.x = Math.PI / 2;\n        // Egzoz\n        const ex = add(new THREE.CylinderGeometry(0.07, 0.07, 0.2, 12), chrome, s * 0.25, 0.4, 2.3);\n        ex.rotation.x = Math.PI / 2;\n    });\n    // Arka difüzör\n    add(new THREE.BoxGeometry(1.4, 0.1, 0.25), dark, 0, 0.3, 2.28);\n    // Tekerlekler (dönen + ön tekerler direksiyonla yönlenen)\n    const spinners = [], pivots = [];\n    const tireGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.3, 28); tireGeo.rotateZ(Math.PI / 2);\n    const discGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.31, 20); discGeo.rotateZ(Math.PI / 2);\n    const tireMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 });\n    const spokeGeo = new THREE.BoxGeometry(0.34, 0.2, 0.06); spokeGeo.translate(0, 0.13, 0);\n    [[-0.9,-1.4,true],[0.9,-1.4,true],[-0.9,1.35,false],[0.9,1.35,false]].forEach(([x, z, front]) => {\n        const spin = new THREE.Group();\n        const tire = new THREE.Mesh(tireGeo, tireMat); tire.castShadow = true; spin.add(tire);\n        spin.add(new THREE.Mesh(discGeo, dark));\n        for (let i = 0; i < 5; i++) {\n            const sp = new THREE.Mesh(spokeGeo, chrome);\n            sp.rotation.x = i * Math.PI * 2 / 5;\n            spin.add(sp);\n        }\n        spinners.push(spin);\n        if (front) {\n            const pivot = new THREE.Group();\n            pivot.position.set(x, 0.38, z);\n            pivot.add(spin);\n            m.add(pivot);\n            pivots.push(pivot);\n        } else {\n            spin.position.set(x, 0.38, z);\n            m.add(spin);\n        }\n    });\n    g.userData = { spinners, pivots };\n    return g;\n}\nfunction updateCarWheels(car, spinAmount, steer) {\n    if (!car || !car.userData.spinners) return;\n    car.userData.spinners.forEach(w => w.rotation.x -= spinAmount);\n    car.userData.pivots.forEach(p => p.rotation.y = steer);\n}\n\n        function createPlayerCar() {\n            const carGroup = buildFerrari458(0xdc1c13);\n            carGroup.position.set(playerCurrentX, 0, 4);\n            scene.add(carGroup);\n            playerCar = carGroup;\n        }\n\n        function createParticleSystem() {\n            const particleCount = 180;\n            const geometry = new THREE.BufferGeometry();\n            const positions = new Float32Array(particleCount * 3);\n\n            for (let i = 0; i < particleCount * 3; i += 3) {\n                positions[i] = (Math.random() - 0.5) * 50;\n                positions[i + 1] = Math.random() * 20;\n                positions[i + 2] = (Math.random() - 0.5) * 200;\n            }\n\n            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));\n            const material = new THREE.PointsMaterial({\n                color: 0x38bdf8,\n                size: 0.4,\n                transparent: true,\n                opacity: 0.5\n            });\n\n            particleSystem = new THREE.Points(geometry, material);\n            scene.add(particleSystem);\n        }\n\n        function spawnObstacleCar() {\n            const carGroup = new THREE.Group();\n            const colors = [0xef4444, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899, 0xe2e8f0];\n            const randomColor = colors[Math.floor(Math.random() * colors.length)];\n\n            const bodyGeo = new THREE.BoxGeometry(1.9, 0.65, 4.2);\n            const bodyMat = new THREE.MeshStandardMaterial({ color: randomColor, roughness: 0.35, metalness: 0.6 });\n            const body = new THREE.Mesh(bodyGeo, bodyMat);\n            body.position.y = 0.5;\n            body.castShadow = true;\n            carGroup.add(body);\n\n            const roofGeo = new THREE.BoxGeometry(1.4, 0.45, 2.0);\n            const roofMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 });\n            const roof = new THREE.Mesh(roofGeo, roofMat);\n            roof.position.set(0, 1.0, -0.1);\n            roof.castShadow = true;\n            carGroup.add(roof);\n\n            const laneIndex = Math.floor(Math.random() * lanes.length);\n            const posX = lanes[laneIndex];\n            const isOncoming = laneIndex < 2; // Lanes 0 and 1: Oncoming traffic coming DOWNWARDS towards player\n\n            // If oncoming, headlight color; if forward, tail light color\n            const lightGeo = new THREE.BoxGeometry(0.35, 0.12, 0.1);\n            const lightMat = new THREE.MeshBasicMaterial({ color: isOncoming ? 0xffffff : 0xff0000 });\n            const l1 = new THREE.Mesh(lightGeo, lightMat);\n            l1.position.set(-0.7, 0.45, isOncoming ? 2.15 : 2.15);\n            carGroup.add(l1);\n            const l2 = new THREE.Mesh(lightGeo, lightMat);\n            l2.position.set(0.7, 0.45, isOncoming ? 2.15 : 2.15);\n            carGroup.add(l2);\n\n            carGroup.position.set(posX, 0, -220);\n            scene.add(carGroup);\n\n            obstacles.push({\n                mesh: carGroup,\n                laneIndex: laneIndex,\n                isOncoming: isOncoming,\n                speed: isOncoming ? (Math.random() * 0.2 + 0.35) : (Math.random() * 0.15 + 0.2)\n            });\n        }\n\n        function setupInputListeners() {\n            window.addEventListener('keydown', (e) => {\n                if (gameState === 'QUIZ') return;\n                initAudio();\n                \n                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {\n                    if (targetLaneIndex > 0 && gameState === 'PLAYING') {\n                        targetLaneIndex--;\n                        playLaneChangeSound();\n                    }\n                }\n                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {\n                    if (targetLaneIndex < lanes.length - 1 && gameState === 'PLAYING') {\n                        targetLaneIndex++;\n                        playLaneChangeSound();\n                    }\n                }\n                if (e.key === 'Shift') {\n                    keys.turbo = true;\n                }\n                if (e.code === 'Space') {\n                    keys.brake = true;\n                    e.preventDefault();\n                }\n            });\n\n            window.addEventListener('keyup', (e) => {\n                if (e.key === 'Shift') keys.turbo = false;\n                if (e.code === 'Space') keys.brake = false;\n            });\n\n            // Touch UI bindings\n            const btnLeft = document.getElementById('btnLeft');\n            const btnRight = document.getElementById('btnRight');\n            const btnTurbo = document.getElementById('btnTurbo');\n            const btnBrake = document.getElementById('btnBrake');\n\n            btnLeft.addEventListener('click', () => {\n                initAudio();\n                if (gameState === 'PLAYING' && targetLaneIndex > 0) {\n                    targetLaneIndex--;\n                    playLaneChangeSound();\n                }\n            });\n            btnRight.addEventListener('click', () => {\n                initAudio();\n                if (gameState === 'PLAYING' && targetLaneIndex < lanes.length - 1) {\n                    targetLaneIndex++;\n                    playLaneChangeSound();\n                }\n            });\n            \n            btnTurbo.addEventListener('touchstart', (e) => { e.preventDefault(); keys.turbo = true; });\n            btnTurbo.addEventListener('touchend', (e) => { e.preventDefault(); keys.turbo = false; });\n            btnBrake.addEventListener('touchstart', (e) => { e.preventDefault(); keys.brake = true; });\n            btnBrake.addEventListener('touchend', (e) => { e.preventDefault(); keys.brake = false; });\n\n            document.getElementById('startBtn').addEventListener('click', () => { initAudio(); startGame(); });\n            document.getElementById('restartBtn').addEventListener('click', () => { initAudio(); startGame(); });\n            document.getElementById('openQuizBtn').addEventListener('click', () => { openQuizModal(); });\n            document.getElementById('menuQuizBtn').addEventListener('click', () => { openQuizModal(true); });\n            document.getElementById('closeQuizBtn').addEventListener('click', () => { closeQuizModal(); });\n            document.getElementById('resumeGameBtn').addEventListener('click', () => { closeQuizModal(); });\n        }\n\n        function openQuizModal(fromMenu = false) {\n            initAudio();\n            if (gameState === 'PLAYING') {\n                quizActiveGamePausedState = 'PLAYING';\n                gameState = 'QUIZ';\n            } else if (gameState === 'MENU' || fromMenu) {\n                quizActiveGamePausedState = 'MENU';\n                gameState = 'QUIZ';\n            }\n            currentQuestionIndex = Math.floor(Math.random() * quizQuestions.length);\n            loadQuizQuestion();\n            document.getElementById('menuScreen').classList.add('hidden');\n            document.getElementById('quizModal').classList.remove('hidden');\n            document.getElementById('quizQuestionContainer').classList.remove('hidden');\n            document.getElementById('quizCompleteContainer').classList.add('hidden');\n        }\n\n        function closeQuizModal() {\n            document.getElementById('quizModal').classList.add('hidden');\n            if (quizActiveGamePausedState === 'PLAYING') {\n                gameState = 'PLAYING';\n            } else {\n                gameState = 'MENU';\n                document.getElementById('menuScreen').classList.remove('hidden');\n            }\n        }\n\n        function loadQuizQuestion() {\n            const q = quizQuestions[currentQuestionIndex];\n            document.getElementById('quizQuestionNumber').innerText = `Traffic Safety Question`;\n            document.getElementById('quizQuestionText').innerText = q.question;\n            \n            const optionsList = document.getElementById('quizOptionsList');\n            optionsList.innerHTML = '';\n            \n            const feedbackEl = document.getElementById('quizFeedback');\n            feedbackEl.classList.add('hidden');\n\n            q.options.forEach((opt, idx) => {\n                const btn = document.createElement('button');\n                btn.className = 'w-full text-left p-4 rounded-xl bg-slate-900/80 hover:bg-emerald-600/20 border border-white/10 hover:border-emerald-500/50 text-sm font-semibold text-slate-200 transition flex items-center justify-between';\n                btn.innerHTML = `<span>${opt}<\/span>`;\n                btn.onclick = () => checkQuizAnswer(idx);\n                optionsList.appendChild(btn);\n            });\n        }\n\n        function checkQuizAnswer(selectedIdx) {\n            const q = quizQuestions[currentQuestionIndex];\n            const feedbackEl = document.getElementById('quizFeedback');\n            feedbackEl.classList.remove('hidden');\n\n            const optionBtns = document.querySelectorAll('#quizOptionsList button');\n            optionBtns.forEach((b, i) => {\n                b.disabled = true;\n                if (i === q.correct) {\n                    b.classList.add('bg-emerald-500/30', 'border-emerald-500');\n                } else if (i === selectedIdx && i !== q.correct) {\n                    b.classList.add('bg-red-500/30', 'border-red-500');\n                }\n            });\n\n            if (selectedIdx === q.correct) {\n                playCorrectSound();\n                feedbackEl.className = 'p-4 rounded-xl text-sm font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 mb-4';\n                feedbackEl.innerText = 'Doğru Cevap! +500 Puan ve %100 Turbo Enerjisi Kazanıldı!';\n                score += 500;\n                turboEnergy = 100;\n            } else {\n                feedbackEl.className = 'p-4 rounded-xl text-sm font-semibold bg-red-500/20 text-red-400 border border-red-500/30 mb-4';\n                feedbackEl.innerText = `Yanlış! Doğru cevap: ${q.options[q.correct]}`;\n            }\n\n            setTimeout(() => {\n                document.getElementById('quizQuestionContainer').classList.add('hidden');\n                document.getElementById('quizCompleteContainer').classList.remove('hidden');\n            }, 1800);\n        }\n\n        function startGame() {\n            obstacles.forEach(obs => scene.remove(obs.mesh));\n            obstacles = [];\n\n            targetLaneIndex = 2; // Default starting in right lane group (same direction)\n            playerCurrentX = lanes[targetLaneIndex];\n            playerCar.position.x = playerCurrentX;\n\n            score = 0;\n            distanceTraveled = 0;\n            quizTriggerDistance = 15000; // Trigger educational quiz periodically\n            gameSpeed = baseSpeed;\n            turboEnergy = 100;\n            isTurboActive = false;\n            isBraking = false;\n            obstacleSpawnTimer = 0;\n\n            document.getElementById('menuScreen').classList.add('hidden');\n            document.getElementById('gameOverScreen').classList.add('hidden');\n            document.getElementById('hud').classList.remove('hidden');\n            document.getElementById('touchControls').classList.remove('hidden');\n            document.getElementById('speedLines').classList.add('active');\n\n            gameState = 'PLAYING';\n        }\n\n        function triggerGameOver() {\n            gameState = 'GAMEOVER';\n            playCrashSound();\n            document.getElementById('speedLines').classList.remove('active');\n            document.getElementById('touchControls').classList.add('hidden');\n            \n            if (score > highScore) {\n                highScore = Math.floor(score);\n                localStorage.setItem('highway_highscore_divided_v3', highScore);\n                document.getElementById('highScoreDisplay').innerText = highScore;\n            }\n\n            document.getElementById('finalScore').innerText = Math.floor(score);\n            document.getElementById('finalHighScore').innerText = highScore;\n            document.getElementById('gameOverScreen').classList.remove('hidden');\n        }\n\n        function onWindowResize() {\n            camera.aspect = window.innerWidth / window.innerHeight;\n            camera.updateProjectionMatrix();\n            renderer.setSize(window.innerWidth, window.innerHeight);\n        }\n\n        function animate() {\n            requestAnimationFrame(animate);\n\n            if (gameState === 'PLAYING') {\n                // Speed control logic (Shift for turbo, Space for brake)\n                if (keys.turbo && turboEnergy > 0) {\n                    isTurboActive = true;\n                    if (gameSpeed < turboSpeed) gameSpeed += 0.015;\n                    turboEnergy -= 0.35;\n                    if (turboEnergy <= 0) {\n                        turboEnergy = 0;\n                        isTurboActive = false;\n                    }\n                } else {\n                    isTurboActive = false;\n                    if (turboEnergy < 100) turboEnergy += 0.08;\n                    \n                    if (keys.brake) {\n                        if (gameSpeed > minSpeed) gameSpeed -= 0.02;\n                    } else {\n                        if (gameSpeed > baseSpeed) gameSpeed -= 0.005;\n                        if (gameSpeed < baseSpeed) gameSpeed += 0.005;\n                    }\n                }\n\n                document.getElementById('turboBar').style.width = `${turboEnergy}%`;\n\n                // Smooth lane switching interpolation (Lerp)\n                const targetX = lanes[targetLaneIndex];\n                playerCurrentX += (targetX - playerCurrentX) * 0.22;\n                playerCar.position.x = playerCurrentX;\n\n                // Car banking tilt effect\n                const tilt = (targetX - playerCurrentX) * 0.08;\n                playerCar.rotation.z = -tilt;\n                playerCar.rotation.y = tilt * 0.4;\n                updateCarWheels(playerCar, Math.min(gameSpeed * 1.1, 1.2), -(targetX - playerCurrentX) * 0.25);\n\n                // Score & distance progression\n                const speedMult = (isTurboActive ? 2.5 : 1.2);\n                score += gameSpeed * speedMult;\n                distanceTraveled += gameSpeed * speedMult * 10;\n                document.getElementById('scoreDisplay').innerText = Math.floor(score);\n                document.getElementById('speedDisplay').innerText = Math.floor(gameSpeed * 110);\n\n                // Check if it's time for an educational traffic quiz checkpoint\n                if (distanceTraveled > quizTriggerDistance) {\n                    quizTriggerDistance += 2000;\n                    openQuizModal();\n                }\n\n                // Road markings scrolling effect\n                roadLines.forEach(line => {\n                    line.position.z += gameSpeed;\n                    if (line.position.z > 10) {\n                        line.position.z -= 120;\n                    }\n                });\n\n                // Particle starfield speed effect\n                const positions = particleSystem.geometry.attributes.position.array;\n                for (let i = 2; i < positions.length; i += 3) {\n                    positions[i] += gameSpeed * 1.8;\n                    if (positions[i] > 40) positions[i] = -160;\n                }\n                particleSystem.geometry.attributes.position.needsUpdate = true;\n\n                // Spawn obstacle traffic cars\n                obstacleSpawnTimer += gameSpeed;\n                if (obstacleSpawnTimer > (isTurboActive ? 28 : 45)) {\n                    spawnObstacleCar();\n                    obstacleSpawnTimer = 0;\n                }\n\n                // Obstacle movement and collision detection\n                for (let i = obstacles.length - 1; i >= 0; i--) {\n                    const obs = obstacles[i];\n                    \n                    if (obs.isOncoming) {\n                        // Oncoming traffic comes towards player faster! Relative speed = gameSpeed + obs.speed\n                        obs.mesh.position.z += (gameSpeed + obs.speed);\n                    } else {\n                        // Same direction traffic moves forward ahead of player\n                        obs.mesh.position.z += (gameSpeed - obs.speed * 0.35);\n                    }\n\n                    const dx = Math.abs(playerCar.position.x - obs.mesh.position.x);\n                    const dz = Math.abs(playerCar.position.z - obs.mesh.position.z);\n\n                    if (dx < 1.5 && dz < 3.0) {\n                        triggerGameOver();\n                    }\n\n                    // Remove out of bounds obstacles\n                    if (obs.mesh.position.z > 15 || obs.mesh.position.z < -300) {\n                        scene.remove(obs.mesh);\n                        obstacles.splice(i, 1);\n                    }\n                }\n\n                // Smooth camera follow\n                camera.position.x += (playerCurrentX * 0.18 - camera.position.x) * 0.05;\n            }\n\n            renderer.render(scene, camera);\n        }\n\n        window.onload = function() {\n            initThree();\n            animate();\n        };\n    <\/script>\n<\/body>\n<\/html>"}];
