<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EKTB Oyunlar</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--tx:#1d1b2e;--mu:#6b6785;--ac:#6c4cff;--ac2:#ff4c8b;--bd:#ddd8f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--card:#201d3d;--tx:#f1eeff;--mu:#a29ec7;--bd:#363160}}
:root[data-theme="dark"]{--bg:#14122a;--card:#201d3d;--tx:#f1eeff;--mu:#a29ec7;--bd:#363160}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#home{min-height:100%;padding:32px 16px;text-align:center}
h1{margin:0;font-size:3rem;letter-spacing:.25em;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);margin:6px 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px 16px;cursor:pointer;color:inherit;font:inherit;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-4px);border-color:var(--ac)}
.card .e{font-size:2.8rem}
.card h3{margin:8px 0 4px}
.card p{margin:0 0 14px;color:var(--mu);font-size:.9rem}
.play{display:inline-block;background:var(--ac);color:#fff;padding:8px 20px;border-radius:10px;font-weight:600}
.card.soon{opacity:.5;cursor:default}
.card.soon:hover{transform:none;border-color:var(--bd)}
.card.soon .play{background:var(--bd);color:var(--mu)}
#game{display:none;position:fixed;inset:0;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
#game.on{display:flex}
#bar{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--card)}
#bar button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 14px;border-radius:10px;font-size:.95rem;cursor:pointer}
#bar b{letter-spacing:.2em;color:var(--ac)}
#gt{color:var(--mu);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fr{flex:1;width:100%;border:0;background:#000}
</style>
</head>
<body>
<div id="home">
<h1>EKTB</h1>
<p class="sub">Bir oyun seç</p>
<div class="grid" id="grid"></div>
</div>
<div id="game">
<div id="bar"><button onclick="back()">← Oyunlar</button><b>EKTB</b><span id="gt"></span></div>
<iframe id="fr" allow="fullscreen; autoplay"></iframe>
</div>
<script>
const GAMES=[{"id": "trafik", "title": "Trafik ve Güvenli Sürüş", "desc": "3D araba simülasyonu: trafikte güvenli sürüş eğitimi.", "emoji": "🚗", "html": "<!DOCTYPE html>\n<html lang=\"tr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>3D Trafik ve Güvenli Sürüş Eğitimi<\/title>\n    <script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n    <link href=\"https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n    <style>\n        body {\n            font-family: 'Fredoka', sans-serif;\n            margin: 0;\n            overflow: hidden;\n            background: #0f172a;\n            user-select: none;\n        }\n        canvas {\n            display: block;\n            width: 100vw;\n            height: 100vh;\n        }\n        .glass-panel {\n            background: rgba(15, 23, 42, 0.85);\n            backdrop-filter: blur(14px);\n            border: 2px solid rgba(56, 189, 248, 0.4);\n        }\n        .pulse-glow {\n            animation: pulseGlow 2s infinite;\n        }\n        @keyframes pulseGlow {\n            0% { transform: scale(1); box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }\n            50% { transform: scale(1.03); box-shadow: 0 0 30px rgba(56, 189, 248, 0.8); }\n            100% { transform: scale(1); box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }\n        }\n        .slide-down {\n            animation: slideDown 0.5s ease-out forwards;\n        }\n        @keyframes slideDown {\n            from { transform: translateY(-50px); opacity: 0; }\n            to { transform: translateY(0); opacity: 1; }\n        }\n    <\/style>\n<\/head>\n<body class=\"relative w-screen h-screen\">\n\n    <div id=\"hud\" class=\"absolute top-0 left-0 w-full p-4 flex justify-between items-center pointer-events-none z-10\">\n        <!-- Left Panel: Stats -->\n        <div class=\"glass-panel px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-6 text-white\">\n            <div>\n                <span class=\"text-xs uppercase font-bold text-sky-400 block\">Puan / Skor<\/span>\n                <span id=\"scoreVal\" class=\"text-4xl font-extrabold text-yellow-400\">0<\/span>\n            <\/div>\n            <div class=\"border-l-2 border-slate-700 pl-6\">\n                <span class=\"text-xs uppercase font-bold text-emerald-400 block\">Hız<\/span>\n                <span id=\"speedVal\" class=\"text-3xl font-extrabold text-white\">0<\/span> <span class=\"text-sm font-bold text-sky-300\">km/s<\/span>\n            <\/div>\n            <div class=\"border-l-2 border-slate-700 pl-6\">\n                <span class=\"text-xs uppercase font-bold text-rose-400 block\">Can / Sağlık<\/span>\n                <div id=\"healthBars\" class=\"flex gap-1 mt-1\">\n                    <span class=\"w-5 h-5 bg-rose-500 rounded-full inline-block shadow\"><\/span>\n                    <span class=\"w-5 h-5 bg-rose-500 rounded-full inline-block shadow\"><\/span>\n                    <span class=\"w-5 h-5 bg-rose-500 rounded-full inline-block shadow\"><\/span>\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <!-- Right Panel: Traffic Rule Tip & Sound Toggle -->\n        <div class=\"flex items-center gap-4 pointer-events-auto\">\n            <div class=\"glass-panel px-6 py-3 rounded-3xl shadow-2xl max-w-xs text-white hidden md:block\">\n                <span class=\"text-xs uppercase font-bold text-amber-400 block\">💡 Trafik Kuralı İpucu<\/span>\n                <p id=\"tipText\" class=\"text-xs font-medium text-slate-200 mt-1\">Kırmızı ışıkta mutlaka dur! Yeşil ışıkta güvenle geç.<\/p>\n            <\/div>\n            <button id=\"soundToggleBtn\" class=\"glass-panel p-4 rounded-full text-white text-xl hover:bg-sky-500/30 transition shadow-lg cursor-pointer\">🔊<\/button>\n            <button id=\"pauseBtn\" class=\"glass-panel p-4 rounded-full text-white text-xl hover:bg-sky-500/30 transition shadow-lg cursor-pointer\">⏸️<\/button>\n        <\/div>\n    <\/div>\n\n    <div id=\"warningBanner\" class=\"absolute top-28 left-1/2 transform -translate-x-1/2 bg-gradient-to-r from-rose-600 to-amber-600 text-white px-8 py-3 rounded-full font-bold text-lg shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-20 flex items-center gap-3\">\n        <span class=\"text-3xl\">⚠️<\/span> <span id=\"warningMsg\">Dikkat! Kırmızı Işıkta Geçtiniz!<\/span>\n    <\/div>\n\n    <!-- Educational Quiz Modal -->\n    <div id=\"quizModal\" class=\"absolute inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-40 hidden\">\n        <div class=\"glass-panel p-8 rounded-3xl max-w-lg w-full text-center border-4 border-sky-400 text-white slide-down shadow-2xl\">\n            <div class=\"w-16 h-16 bg-sky-500/20 text-sky-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-4\">🚦<\/div>\n            <h2 class=\"text-2xl font-extrabold mb-2 text-sky-300\">Trafik Güvenliği Soru Kartı<\/h2>\n            <p id=\"quizQuestion\" class=\"text-lg font-semibold mb-6 text-slate-100\">Karşıdan karşıya geçerken ilk önce hangi yöne bakmalıyız?<\/p>\n            <div id=\"quizOptions\" class=\"grid grid-cols-1 gap-3\"><\/div>\n        <\/div>\n    <\/div>\n\n    <!-- Start / Game Over / Pause Menu Overlay -->\n    <div id=\"menuOverlay\" class=\"absolute inset-0 bg-slate-950/80 backdrop-blur-lg flex items-center justify-center z-50\">\n        <div class=\"glass-panel p-10 rounded-3xl shadow-2xl max-w-lg w-full text-center border-4 border-sky-400 text-white\">\n            <div class=\"w-24 h-24 bg-gradient-to-tr from-sky-500 to-indigo-600 rounded-3xl flex items-center justify-center text-5xl mx-auto mb-6 shadow-xl transform rotate-3 pulse-glow\">🚗<\/div>\n            <h1 id=\"menuTitle\" class=\"text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-emerald-400 mb-3\">Trafik Canavarı Değil, Güvenli Sürücü<\/h1>\n            <p id=\"menuDesc\" class=\"text-slate-300 mb-6 text-sm leading-relaxed font-medium\">Binalar, taşlar, yayalar ve çalışan trafik ışıkları arasında güvenle sür! Yıldızları topla, kırmızı ışıkta durup yeşil ışıkta geçerek puanları kap.<\/p>\n            \n            <!-- Car Customization Color Picker -->\n            <div class=\"mb-6 bg-slate-900/60 p-4 rounded-2xl border border-slate-700\">\n                <span class=\"text-xs uppercase font-bold text-sky-400 block mb-2\">Spor Araba Rengini Seç<\/span>\n                <div class=\"flex justify-center gap-4\">\n                    <button class=\"color-btn w-10 h-10 rounded-full bg-rose-500 ring-4 ring-white/50 cursor-pointer transition transform hover:scale-110\" data-color=\"0xef4444\"><\/button>\n                    <button class=\"color-btn w-10 h-10 rounded-full bg-sky-500 cursor-pointer transition transform hover:scale-110\" data-color=\"0x0ea5e9\"><\/button>\n                    <button class=\"color-btn w-10 h-10 rounded-full bg-emerald-500 cursor-pointer transition transform hover:scale-110\" data-color=\"0x10b981\"><\/button>\n                    <button class=\"color-btn w-10 h-10 rounded-full bg-amber-500 cursor-pointer transition transform hover:scale-110\" data-color=\"0xf59e0b\"><\/button>\n                    <button class=\"color-btn w-10 h-10 rounded-full bg-purple-500 cursor-pointer transition transform hover:scale-110\" data-color=\"0xa855f7\"><\/button>\n                <\/div>\n            <\/div>\n\n            <button id=\"startBtn\" class=\"w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-extrabold text-xl rounded-2xl shadow-xl transform transition active:scale-95 pulse-glow cursor-pointer\">\n                Oyuna Başla 🎮\n            <\/button>\n        <\/div>\n    <\/div>\n\n    <!-- Mobile Touch Controls -->\n    <div class=\"absolute bottom-6 left-0 w-full px-6 flex justify-between items-center z-10 md:hidden pointer-events-auto\">\n        <div class=\"flex gap-4\">\n            <button id=\"leftBtn\" class=\"w-20 h-20 bg-slate-800/80 backdrop-blur border border-sky-400 rounded-2xl shadow-2xl text-3xl font-extrabold flex items-center justify-center text-sky-400 active:bg-sky-500 active:text-white\">⬅️<\/button>\n            <button id=\"rightBtn\" class=\"w-20 h-20 bg-slate-800/80 backdrop-blur border border-sky-400 rounded-2xl shadow-2xl text-3xl font-extrabold flex items-center justify-center text-sky-400 active:bg-sky-500 active:text-white\">➡️<\/button>\n        <\/div>\n        <div class=\"flex gap-4\">\n            <button id=\"brakeBtn\" class=\"w-20 h-20 bg-rose-600/80 backdrop-blur border border-rose-400 rounded-2xl shadow-2xl text-xl font-extrabold flex items-center justify-center text-white active:bg-rose-700\">🛑 Fren<\/button>\n            <button id=\"gasBtn\" class=\"w-20 h-20 bg-emerald-600/80 backdrop-blur border border-emerald-400 rounded-2xl shadow-2xl text-xl font-extrabold flex items-center justify-center text-white active:bg-emerald-700\">🚀 Gaz<\/button>\n        <\/div>\n    <\/div>\n\n    <script>\n        class SoundManager {\n            constructor() {\n                this.ctx = null;\n                this.enabled = true;\n                this.initAudio();\n            }\n\n            initAudio() {\n                const AudioContext = window.AudioContext || window.webkitAudioContext;\n                if (AudioContext) {\n                    this.ctx = new AudioContext();\n                }\n            }\n\n            playEngine(speedRatio) {\n                if (!this.enabled || !this.ctx) return;\n                try {\n                    if (this.ctx.state === 'suspended') this.ctx.resume();\n                    const osc = this.ctx.createOscillator();\n                    const gain = this.ctx.createGain();\n                    osc.type = 'sawtooth';\n                    osc.frequency.setValueAtTime(55 + speedRatio * 110, this.ctx.currentTime);\n                    gain.gain.setValueAtTime(0.04, this.ctx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);\n                    osc.connect(gain);\n                    gain.connect(this.ctx.destination);\n                    osc.start();\n                    osc.stop(this.ctx.currentTime + 0.1);\n                } catch(e) {}\n            }\n\n            playCoin() {\n                if (!this.enabled || !this.ctx) return;\n                try {\n                    const osc = this.ctx.createOscillator();\n                    const gain = this.ctx.createGain();\n                    osc.type = 'sine';\n                    osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);\n                    osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08);\n                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);\n                    osc.connect(gain);\n                    gain.connect(this.ctx.destination);\n                    osc.start();\n                    osc.stop(this.ctx.currentTime + 0.3);\n                } catch(e) {}\n            }\n\n            playCrash() {\n                if (!this.enabled || !this.ctx) return;\n                try {\n                    const bufferSize = this.ctx.sampleRate * 0.3;\n                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);\n                    const output = buffer.getChannelData(0);\n                    for (let i = 0; i < bufferSize; i++) {\n                        output[i] = Math.random() * 2 - 1;\n                    }\n                    const whiteNoise = this.ctx.createBufferSource();\n                    whiteNoise.buffer = buffer;\n                    const filter = this.ctx.createBiquadFilter();\n                    filter.type = 'lowpass';\n                    filter.frequency.setValueAtTime(800, this.ctx.currentTime);\n                    filter.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.3);\n                    const gain = this.ctx.createGain();\n                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);\n                    whiteNoise.connect(filter);\n                    filter.connect(gain);\n                    gain.connect(this.ctx.destination);\n                    whiteNoise.start();\n                } catch(e) {}\n            }\n        }\n\n        const soundManager = new SoundManager();\n\n        let scene, camera, renderer, car;\n        let roadLines = [], obstacles = [], buildings = [], trees = [];\n        let isGameStarted = false;\n        let isPaused = false;\n        let score = 0;\n        let health = 3;\n        let speed = 0.4;\n        let targetCarX = 0;\n        let carX = 0;\n        let carColor = 0xef4444;\n        let spawnTimer = 0;\n        let keyLeft = false, keyRight = false, keyGas = false, keyBrake = false;\n        \n        // Traffic Light System\n        let trafficLightPoles = [];\n        let currentTrafficLightState = 'green'; // 'red', 'yellow', 'green'\n        let trafficLightTimer = 0;\n\n        const educationalTips = [\n            \"Kırmızı ışıkta mutlaka durmalı, yeşil ışıkta güvenle geçmeliyiz.\",\n            \"Yoldaki taşların üzerinden geçmek araca zarar verir, etrafından dolaş!\",\n            \"Yayalar karşıya geçerken onlara her zaman öncelik vermeliyiz.\",\n            \"Kaldırımlarda yürümeli, yola ani atlamamalıyız.\",\n            \"Yıldız ve rozetleri toplayarak güvenli sürüş puanı kazan!\"\n        ];\n\n        const quizBank = [\n            {\n                q: \"Karşıdan karşıya geçerken ilk önce hangi yöne bakmalıyız?\",\n                options: [\"Önce sola, sonra sağa, tekrar sola\", \"Koşarak hızlıca karşıya\", \"Sadece arkaya\"],\n                correct: 0\n            },\n            {\n                q: \"Trafik lambasında kırmızı ışık yanıyorsa ne yapmalıyız?\",\n                options: [\"Hızlanıp geçmeliyiz\", \"Kesinlikle durmalıyız\", \"Korna çalıp beklemeliyiz\"],\n                correct: 1\n            },\n            {\n                q: \"Yolda yürürken nerede yürümülüdür?\",\n                options: [\"Taşıt yolunun ortasında\", \"Kaldırımda\", \"Bisiklet yolunda\"],\n                correct: 1\n            }\n        ];\n\n        function init() {\n            scene = new THREE.Scene();\n            scene.background = new THREE.Color(0x0284c7);\n            scene.fog = new THREE.FogExp2(0x0284c7, 0.012);\n\n            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);\n            camera.position.set(0, 6, 11);\n            camera.lookAt(0, 0, -2);\n\n            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: \"high-performance\" });\n            renderer.setSize(window.innerWidth, window.innerHeight);\n            renderer.shadowMap.enabled = true;\n            renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n            document.body.appendChild(renderer.domElement);\n\n            // Lighting\n            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);\n            scene.add(ambientLight);\n\n            const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.2);\n            sunLight.position.set(20, 40, 20);\n            sunLight.castShadow = true;\n            sunLight.shadow.mapSize.width = 2048;\n            sunLight.shadow.mapSize.height = 2048;\n            sunLight.shadow.camera.near = 0.5;\n            sunLight.shadow.camera.far = 200;\n            const d = 30;\n            sunLight.shadow.camera.left = -d;\n            sunLight.shadow.camera.right = d;\n            sunLight.shadow.camera.top = d;\n            sunLight.shadow.camera.bottom = -d;\n            scene.add(sunLight);\n\n            createEnvironment();\n            createDetailedSportsCar();\n\n            // Event Listeners\n            window.addEventListener('resize', onWindowResize);\n            window.addEventListener('keydown', handleKeyDown);\n            window.addEventListener('keyup', handleKeyUp);\n\n            setupTouchControls();\n            setupColorPickers();\n\n            document.getElementById('startBtn').addEventListener('click', startGame);\n            document.getElementById('soundToggleBtn').addEventListener('click', toggleSound);\n            document.getElementById('pauseBtn').addEventListener('click', togglePause);\n\n            animate();\n        }\n\n        function createEnvironment() {\n            // Grass Ground\n            const grassGeo = new THREE.PlaneGeometry(300, 1600);\n            const grassMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.9 });\n            const grass = new THREE.Mesh(grassGeo, grassMat);\n            grass.rotation.x = -Math.PI / 2;\n            grass.position.set(0, -0.15, -600);\n            scene.add(grass);\n\n            // Sidewalks\n            const sideGeo = new THREE.BoxGeometry(2.5, 0.2, 1600);\n            const sideMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.7 });\n            \n            const leftSidewalk = new THREE.Mesh(sideGeo, sideMat);\n            leftSidewalk.position.set(-6.25, 0, -600);\n            leftSidewalk.receiveShadow = true;\n            scene.add(leftSidewalk);\n\n            const rightSidewalk = new THREE.Mesh(sideGeo, sideMat);\n            rightSidewalk.position.set(6.25, 0, -600);\n            rightSidewalk.receiveShadow = true;\n            scene.add(rightSidewalk);\n\n            // Asphalt Road\n            const roadGeo = new THREE.PlaneGeometry(10, 1600);\n            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });\n            const road = new THREE.Mesh(roadGeo, roadMat);\n            road.rotation.x = -Math.PI / 2;\n            road.position.set(0, 0, -600);\n            road.receiveShadow = true;\n            scene.add(road);\n\n            // Center lane dashed lines\n            for (let i = 0; i > -700; i -= 8) {\n                const lineGeo = new THREE.BoxGeometry(0.3, 0.02, 3);\n                const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });\n                const line = new THREE.Mesh(lineGeo, lineMat);\n                line.position.set(0, 0.01, i);\n                scene.add(line);\n                roadLines.push(line);\n            }\n\n            // Spawn Buildings, Trees, and Traffic Lights along sidewalks\n            for (let z = 10; z > -700; z -= 30) {\n                createBuildingPair(z);\n                createTreePair(z + 15);\n                if (z % 90 === 0) {\n                    createTrafficLight(z);\n                }\n            }\n        }\n\n        function createBuildingPair(zPos) {\n            const colors = [0x3b82f6, 0x6366f1, 0x8b5cf6, 0xec4899, 0x14b8a6, 0xf59e0b];\n            \n            // Left Building\n            const h1 = 12 + Math.random() * 16;\n            const bGeo1 = new THREE.BoxGeometry(6.5, h1, 8);\n            const bMat1 = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)], roughness: 0.4 });\n            const b1 = new THREE.Mesh(bGeo1, bMat1);\n            b1.position.set(-13, h1 / 2, zPos);\n            b1.castShadow = true;\n            b1.receiveShadow = true;\n            scene.add(b1);\n            buildings.push(b1);\n\n            // Right Building\n            const h2 = 12 + Math.random() * 16;\n            const bGeo2 = new THREE.BoxGeometry(6.5, h2, 8);\n            const bMat2 = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)], roughness: 0.4 });\n            const b2 = new THREE.Mesh(bGeo2, bMat2);\n            b2.position.set(13, h2 / 2, zPos);\n            b2.castShadow = true;\n            b2.receiveShadow = true;\n            scene.add(b2);\n            buildings.push(b2);\n        }\n\n        function createTreePair(zPos) {\n            const createTree = (x) => {\n                const treeGroup = new THREE.Group();\n                const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2, 8);\n                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x78350f });\n                const trunk = new THREE.Mesh(trunkGeo, trunkMat);\n                trunk.position.y = 1;\n                trunk.castShadow = true;\n                treeGroup.add(trunk);\n\n                const leavesGeo = new THREE.ConeGeometry(1.6, 3.5, 8);\n                const leavesMat = new THREE.MeshStandardMaterial({ color: 0x15803d });\n                const leaves = new THREE.Mesh(leavesGeo, leavesMat);\n                leaves.position.y = 3.2;\n                leaves.castShadow = true;\n                treeGroup.add(leaves);\n\n                treeGroup.position.set(x, 0, zPos);\n                scene.add(treeGroup);\n                trees.push(treeGroup);\n            };\n\n            createTree(-8.5);\n            createTree(8.5);\n        }\n\n        function createTrafficLight(zPos) {\n            const group = new THREE.Group();\n\n            // Pole\n            const poleGeo = new THREE.CylinderGeometry(0.15, 0.15, 6, 12);\n            const poleMat = new THREE.MeshStandardMaterial({ color: 0x475569 });\n            const pole = new THREE.Mesh(poleGeo, poleMat);\n            pole.position.y = 3;\n            pole.castShadow = true;\n            group.add(pole);\n\n            // Light Housing Box\n            const boxGeo = new THREE.BoxGeometry(0.8, 2.2, 0.6);\n            const boxMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });\n            const box = new THREE.Mesh(boxGeo, boxMat);\n            box.position.set(0, 5, 0);\n            group.add(box);\n\n            // Bulbs (Red, Yellow, Green)\n            const bulbGeo = new THREE.SphereGeometry(0.22, 16, 16);\n            \n            const redMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });\n            const redBulb = new THREE.Mesh(bulbGeo, redMat);\n            redBulb.position.set(0, 5.7, 0.31);\n            redBulb.name = 'redBulb';\n            group.add(redBulb);\n\n            const yellowMat = new THREE.MeshBasicMaterial({ color: 0x451a03 });\n            const yellowBulb = new THREE.Mesh(bulbGeo, yellowMat);\n            yellowBulb.position.set(0, 5, 0.31);\n            yellowBulb.name = 'yellowBulb';\n            group.add(yellowBulb);\n\n            const greenMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });\n            const greenBulb = new THREE.Mesh(bulbGeo, greenMat);\n            greenBulb.position.set(0, 4.3, 0.31);\n            greenBulb.name = 'greenBulb';\n            group.add(greenBulb);\n\n            group.position.set(5.5, 0, zPos);\n            scene.add(group);\n            trafficLightPoles.push(group);\n        }\n\n        function buildFerrari458(color) {\n    const g = new THREE.Group(), m = new THREE.Group();\n    g.add(m);\n    const paint = new THREE.MeshStandardMaterial({ color, roughness: 0.2, metalness: 0.65 });\n    const dark = new THREE.MeshStandardMaterial({ color: 0x0b0f14, roughness: 0.45, metalness: 0.5 });\n    const glass = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.05, metalness: 0.9 });\n    const chrome = new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.2, metalness: 0.95 });\n    const extrude = (pts, depth, bevel) => {\n        const sh = new THREE.Shape();\n        pts.forEach((p, i) => i ? sh.lineTo(p[0], p[1]) : sh.moveTo(p[0], p[1]));\n        const geo = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 2 });\n        geo.translate(0, 0, -depth / 2);\n        geo.rotateY(Math.PI / 2); // şekil x'i -> dünya -z (ön = -z)\n        return geo;\n    };\n    const add = (geo, mat, x, y, z, shadow) => {\n        const mesh = new THREE.Mesh(geo, mat);\n        mesh.position.set(x, y, z);\n        if (shadow) mesh.castShadow = true;\n        m.add(mesh);\n        return mesh;\n    };\n    // Gövde (yandan profil, ön = sağ)\n    add(extrude([[-2.25,0.25],[2.2,0.25],[2.25,0.45],[2.0,0.58],[1.3,0.68],[0.7,0.72],[-1.3,0.78],[-1.6,0.9],[-2.2,0.92],[-2.25,0.7]], 1.5, 0.06), paint, 0, 0, 0, true);\n    // Kabin camları + tavan\n    add(extrude([[0.75,0.72],[0.2,1.08],[-0.85,1.1],[-1.4,0.85],[-1.4,0.72]], 1.3, 0.03), glass, 0, 0, 0, true);\n    add(new THREE.BoxGeometry(1.15, 0.04, 0.95), paint, 0, 1.13, 0.3);\n    // Yan hava girişleri (kapı arkası)\n    [-1, 1].forEach(s => {\n        add(new THREE.BoxGeometry(0.05, 0.2, 0.7), dark, s * 0.84, 0.52, 0.95);\n        add(new THREE.BoxGeometry(0.12, 0.07, 0.16), paint, s * 0.88, 0.85, -0.6); // ayna\n    });\n    // Ön ızgara, ön lip, farlar\n    add(new THREE.BoxGeometry(1.1, 0.16, 0.06), dark, 0, 0.38, -2.27);\n    add(new THREE.BoxGeometry(1.7, 0.05, 0.3), dark, 0, 0.26, -2.2);\n    [-1, 1].forEach(s => {\n        const hl = add(new THREE.BoxGeometry(0.5, 0.1, 0.06), new THREE.MeshBasicMaterial({ color: 0xfef9c3 }), s * 0.55, 0.58, -2.15);\n        hl.rotation.y = s * 0.12;\n        // Yuvarlak çift stop lambası\n        const tl = add(new THREE.CylinderGeometry(0.13, 0.13, 0.05, 16), new THREE.MeshBasicMaterial({ color: 0xef1c1c }), s * 0.55, 0.76, 2.28);\n        tl.rotation.x = Math.PI / 2;\n        // Egzoz\n        const ex = add(new THREE.CylinderGeometry(0.07, 0.07, 0.2, 12), chrome, s * 0.25, 0.4, 2.3);\n        ex.rotation.x = Math.PI / 2;\n    });\n    // Arka difüzör\n    add(new THREE.BoxGeometry(1.4, 0.1, 0.25), dark, 0, 0.3, 2.28);\n    // Tekerlekler (dönen + ön tekerler direksiyonla yönlenen)\n    const spinners = [], pivots = [];\n    const tireGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.3, 28); tireGeo.rotateZ(Math.PI / 2);\n    const discGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.31, 20); discGeo.rotateZ(Math.PI / 2);\n    const tireMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 });\n    const spokeGeo = new THREE.BoxGeometry(0.34, 0.2, 0.06); spokeGeo.translate(0, 0.13, 0);\n    [[-0.9,-1.4,true],[0.9,-1.4,true],[-0.9,1.35,false],[0.9,1.35,false]].forEach(([x, z, front]) => {\n        const spin = new THREE.Group();\n        const tire = new THREE.Mesh(tireGeo, tireMat); tire.castShadow = true; spin.add(tire);\n        spin.add(new THREE.Mesh(discGeo, dark));\n        for (let i = 0; i < 5; i++) {\n            const sp = new THREE.Mesh(spokeGeo, chrome);\n            sp.rotation.x = i * Math.PI * 2 / 5;\n            spin.add(sp);\n        }\n        spinners.push(spin);\n        if (front) {\n            const pivot = new THREE.Group();\n            pivot.position.set(x, 0.38, z);\n            pivot.add(spin);\n            m.add(pivot);\n            pivots.push(pivot);\n        } else {\n            spin.position.set(x, 0.38, z);\n            m.add(spin);\n        }\n    });\n    g.userData = { spinners, pivots };\n    return g;\n}\nfunction updateCarWheels(car, spinAmount, steer) {\n    if (!car || !car.userData.spinners) return;\n    car.userData.spinners.forEach(w => w.rotation.x -= spinAmount);\n    car.userData.pivots.forEach(p => p.rotation.y = steer);\n}\n\n        function createDetailedSportsCar() {\n            car = buildFerrari458(carColor);\n            car.position.set(0, 0, 0);\n            scene.add(car);\n        }\n\n        function spawnObstacleOrCollectible() {\n            const rand = Math.random();\n            const laneX = (Math.floor(Math.random() * 3) - 1) * 3.2; // -3.2, 0, 3.2\n            const zStart = -160;\n\n            const group = new THREE.Group();\n\n            if (rand < 0.35) {\n                // Rock obstacle\n                const rockGeo = new THREE.DodecahedronGeometry(0.7, 1);\n                const rockMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.8 });\n                const rock = new THREE.Mesh(rockGeo, rockMat);\n                rock.position.y = 0.5;\n                rock.castShadow = true;\n                group.add(rock);\n                group.userData = { type: 'rock', width: 1.2, text: 'Taş Engeli! Etrafından dolaş.' };\n            } else if (rand < 0.65) {\n                // Construction Barrier / Block\n                const bGeo = new THREE.BoxGeometry(2.2, 1.2, 1);\n                const bMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.3 });\n                const b = new THREE.Mesh(bGeo, bMat);\n                b.position.y = 0.6;\n                b.castShadow = true;\n                group.add(b);\n                group.userData = { type: 'barrier', width: 2.2, text: 'İnşaat Bariyeri! Dikkatli geç.' };\n            } else if (rand < 0.85) {\n                // Collectible Safety Star / Badge\n                const starGeo = new THREE.OctahedronGeometry(0.6, 0);\n                const starMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, roughness: 0.2 });\n                const star = new THREE.Mesh(starGeo, starMat);\n                star.position.y = 1;\n                group.add(star);\n                group.userData = { type: 'star', width: 1.0, text: 'Harika! Güvenlik Rozeti Kazandın (+50 Puan)' };\n            } else {\n                // Pedestrian crossing road safely\n                const pGroup = new THREE.Group();\n                const bodyGeo = new THREE.CapsuleGeometry(0.3, 0.9, 8, 16);\n                const pMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });\n                const pBody = new THREE.Mesh(bodyGeo, pMat);\n                pBody.position.y = 0.9;\n                pBody.castShadow = true;\n                pGroup.add(pBody);\n                \n                const headGeo = new THREE.SphereGeometry(0.25, 16, 16);\n                const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });\n                const head = new THREE.Mesh(headGeo, headMat);\n                head.position.y = 1.7;\n                pGroup.add(head);\n\n                group.add(pGroup);\n                group.userData = { type: 'pedestrian', width: 1.5, text: 'Yaya Geçidi! Yayaya mutlaka yol ver.' };\n            }\n\n            group.position.set(laneX, 0, zStart);\n            scene.add(group);\n            obstacles.push(group);\n        }\n\n        function animate() {\n            requestAnimationFrame(animate);\n\n            if (!isGameStarted || isPaused) {\n                renderer.render(scene, camera);\n                return;\n            }\n\n            // Traffic light cycle timer & dynamic color updating\n            trafficLightTimer++;\n            if (trafficLightTimer > 450) {\n                trafficLightTimer = 0;\n                if (currentTrafficLightState === 'green') currentTrafficLightState = 'yellow';\n                else if (currentTrafficLightState === 'yellow') currentTrafficLightState = 'red';\n                else currentTrafficLightState = 'green';\n            }\n\n            // Update all traffic light poles in the world\n            trafficLightPoles.forEach(poleGroup => {\n                const redBulb = poleGroup.getObjectByName('redBulb');\n                const yellowBulb = poleGroup.getObjectByName('yellowBulb');\n                const greenBulb = poleGroup.getObjectByName('greenBulb');\n\n                if (redBulb && yellowBulb && greenBulb) {\n                    if (currentTrafficLightState === 'red') {\n                        redBulb.material.color.setHex(0xef4444);\n                        yellowBulb.material.color.setHex(0x451a03);\n                        greenBulb.material.color.setHex(0x14532d);\n                    } else if (currentTrafficLightState === 'yellow') {\n                        redBulb.material.color.setHex(0x7f1d1d);\n                        yellowBulb.material.color.setHex(0xf59e0b);\n                        greenBulb.material.color.setHex(0x14532d);\n                    } else {\n                        redBulb.material.color.setHex(0x7f1d1d);\n                        yellowBulb.material.color.setHex(0x451a03);\n                        greenBulb.material.color.setHex(0x22c55e);\n                    }\n                }\n            });\n\n            // Speed & Acceleration logic\n            let currentSpeedLimit = 0.6;\n            if (currentTrafficLightState === 'red') {\n                currentSpeedLimit = 0.12; // Must slow down or stop at red light!\n            }\n\n            if (keyGas) speed = Math.min(0.9, speed + 0.01);\n            else if (keyBrake) speed = Math.max(0.05, speed - 0.02);\n            else {\n                if (speed > currentSpeedLimit) speed -= 0.005;\n                else if (speed < currentSpeedLimit) speed += 0.005;\n            }\n\n            soundManager.playEngine(speed);\n            document.getElementById('speedVal').innerText = Math.round(speed * 150);\n\n            // Check if player stopped properly at a red light near any traffic light pole\n            trafficLightPoles.forEach(pole => {\n                const dz = Math.abs(car.position.z - pole.position.z);\n                if (dz < 8 && currentTrafficLightState === 'red' && speed < 0.2) {\n                    if (!pole.userData.rewarded) {\n                        pole.userData.rewarded = true;\n                        soundManager.playCoin();\n                        score += 30;\n                        document.getElementById('scoreVal').innerText = score;\n                        showWarning('Harika! Kırmızı Işıkta Doğru Durdun! (+30 Puan)', 'emerald');\n                    }\n                } else if (dz > 12) {\n                    pole.userData.rewarded = false;\n                }\n            });\n\n            // Steering controls\n            if (keyLeft) targetCarX -= 0.18;\n            if (keyRight) targetCarX += 0.18;\n            targetCarX = Math.max(-4.2, Math.min(4.2, targetCarX));\n            carX += (targetCarX - carX) * 0.12;\n            car.position.x = carX;\n            car.rotation.z = (carX - targetCarX) * 0.25;\n            car.rotation.y = (carX - targetCarX) * 0.1;\n            updateCarWheels(car, Math.min(speed * 1.1, 1.2), -(targetCarX - carX) * 0.3);\n\n            // Move Road Lines seamlessly\n            roadLines.forEach(line => {\n                line.position.z += speed;\n                if (line.position.z > 15) line.position.z = -600;\n            });\n\n            // Move Buildings seamlessly together with the road\n            buildings.forEach(b => {\n                b.position.z += speed;\n                if (b.position.z > 25) {\n                    b.position.z = -600;\n                }\n            });\n\n            // Move Trees seamlessly together with the road\n            trees.forEach(t => {\n                t.position.z += speed;\n                if (t.position.z > 25) {\n                    t.position.z = -600;\n                }\n            });\n\n            // Move Traffic Light Poles seamlessly\n            trafficLightPoles.forEach(p => {\n                p.position.z += speed;\n                if (p.position.z > 25) {\n                    p.position.z = -600;\n                }\n            });\n\n            // Spawn obstacles timer\n            spawnTimer++;\n            if (spawnTimer > 45) {\n                spawnObstacleOrCollectible();\n                spawnTimer = 0;\n            }\n\n            // Update obstacles & collectibles\n            for (let i = obstacles.length - 1; i >= 0; i--) {\n                const obs = obstacles[i];\n                obs.position.z += speed;\n\n                if (obs.userData.type === 'star') {\n                    obs.rotation.y += 0.05;\n                }\n\n                const dx = Math.abs(car.position.x - obs.position.x);\n                const dz = Math.abs(car.position.z - obs.position.z);\n\n                if (dx < obs.userData.width && dz < 1.5) {\n                    if (obs.userData.type === 'star') {\n                        soundManager.playCoin();\n                        score += 50;\n                        document.getElementById('scoreVal').innerText = score;\n                        showWarning(obs.userData.text, 'emerald');\n                        scene.remove(obs);\n                        obstacles.splice(i, 1);\n                        continue;\n                    } else {\n                        soundManager.playCrash();\n                        health--;\n                        updateHealthDisplay();\n                        showWarning(obs.userData.text, 'rose');\n                        scene.remove(obs);\n                        obstacles.splice(i, 1);\n\n                        if (health <= 0) {\n                            endGame();\n                        }\n                        continue;\n                    }\n                }\n\n                if (obs.position.z > 15) {\n                    scene.remove(obs);\n                    obstacles.splice(i, 1);\n                    if (obs.userData.type !== 'star') {\n                        score += 10;\n                        document.getElementById('scoreVal').innerText = score;\n                    }\n\n                    if (Math.random() < 0.25) {\n                        const randomTip = educationalTips[Math.floor(Math.random() * educationalTips.length)];\n                        document.getElementById('tipText').innerText = randomTip;\n                    }\n                }\n            }\n\n            renderer.render(scene, camera);\n        }\n\n        function showWarning(msg, type = 'rose') {\n            const banner = document.getElementById('warningBanner');\n            const msgEl = banner.querySelector('span:last-child');\n            msgEl.innerText = msg;\n            banner.className = `absolute top-28 left-1/2 transform -translate-x-1/2 bg-gradient-to-r ${type === 'rose' ? 'from-rose-600 to-amber-600' : 'from-emerald-600 to-teal-600'} text-white px-8 py-3 rounded-full font-bold text-lg shadow-2xl transition-all duration-300 opacity-100 z-20 flex items-center gap-3`;\n            setTimeout(() => {\n                banner.style.opacity = '0';\n            }, 2500);\n        }\n\n        function updateHealthDisplay() {\n            const container = document.getElementById('healthBars');\n            container.innerHTML = '';\n            for (let i = 0; i < health; i++) {\n                const span = document.createElement('span');\n                span.className = 'w-5 h-5 bg-rose-500 rounded-full inline-block shadow';\n                container.appendChild(span);\n            }\n        }\n\n        function triggerQuiz() {\n            isPaused = true;\n            const modal = document.getElementById('quizModal');\n            const qEl = document.getElementById('quizQuestion');\n            const optContainer = document.getElementById('quizOptions');\n            optContainer.innerHTML = '';\n\n            const quiz = quizBank[Math.floor(Math.random() * quizBank.length)];\n            qEl.innerText = quiz.q;\n\n            quiz.options.forEach((opt, idx) => {\n                const btn = document.createElement('button');\n                btn.className = 'w-full py-3 bg-slate-800 hover:bg-sky-600 border border-sky-400/50 rounded-xl font-bold text-white transition shadow-lg cursor-pointer';\n                btn.innerText = opt;\n                btn.onclick = () => {\n                    if (idx === quiz.correct) {\n                        soundManager.playCoin();\n                        score += 100;\n                        document.getElementById('scoreVal').innerText = score;\n                        showWarning('Doğru Cevap! +100 Puan', 'emerald');\n                    } else {\n                        soundManager.playCrash();\n                        showWarning('Yanlış Cevap! Dikkatli ol.', 'rose');\n                    }\n                    modal.classList.add('hidden');\n                    isPaused = false;\n                };\n                optContainer.appendChild(btn);\n            });\n\n            modal.classList.remove('hidden');\n        }\n\n        function startGame() {\n            isGameStarted = true;\n            isPaused = false;\n            score = 0;\n            health = 3;\n            speed = 0.4;\n            document.getElementById('scoreVal').innerText = '0';\n            updateHealthDisplay();\n            document.getElementById('menuOverlay').classList.add('hidden');\n\n            setInterval(() => {\n                if (isGameStarted && !isPaused && Math.random() < 0.5) {\n                    triggerQuiz();\n                }\n            }, 30000);\n        }\n\n        function togglePause() {\n            if (!isGameStarted) return;\n            isPaused = !isPaused;\n            document.getElementById('pauseBtn').innerText = isPaused ? '▶️' : '⏸️';\n        }\n\n        function toggleSound() {\n            soundManager.enabled = !soundManager.enabled;\n            document.getElementById('soundToggleBtn').innerText = soundManager.enabled ? '🔊' : '🔇';\n        }\n\n        function endGame() {\n            isGameStarted = false;\n            const overlay = document.getElementById('menuOverlay');\n            document.getElementById('menuTitle').innerText = 'Oyun Bitti - Güvenli Sürüş Eğitimi';\n            document.getElementById('menuDesc').innerHTML = `Tebrikler! Toplam Skorun: <strong class=\"text-yellow-400 text-xl\">${score}<\/strong>.<br>Trafik kurallarına uyarak harika bir sürüş deneyimi gerçekleştirdin!`;\n            document.getElementById('startBtn').innerText = 'Tekrar Oyna 🔄';\n            overlay.classList.remove('hidden');\n        }\n\n        function handleKeyDown(e) {\n            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyLeft = true;\n            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = true;\n            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keyGas = true;\n            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keyBrake = true;\n        }\n\n        function handleKeyUp(e) {\n            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyLeft = false;\n            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = false;\n            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keyGas = false;\n            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keyBrake = false;\n        }\n\n        function setupTouchControls() {\n            const bindTouch = (id, startAction, endAction) => {\n                const el = document.getElementById(id);\n                if (!el) return;\n                el.addEventListener('touchstart', (e) => { e.preventDefault(); startAction(); });\n                el.addEventListener('touchend', (e) => { e.preventDefault(); endAction(); });\n                el.addEventListener('mousedown', (e) => { e.preventDefault(); startAction(); });\n                el.addEventListener('mouseup', (e) => { e.preventDefault(); endAction(); });\n            };\n\n            bindTouch('leftBtn', () => keyLeft = true, () => keyLeft = false);\n            bindTouch('rightBtn', () => keyRight = true, () => keyRight = false);\n            bindTouch('gasBtn', () => keyGas = true, () => keyGas = false);\n            bindTouch('brakeBtn', () => keyBrake = true, () => keyBrake = false);\n        }\n\n        function setupColorPickers() {\n            document.querySelectorAll('.color-btn').forEach(btn => {\n                btn.addEventListener('click', (e) => {\n                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('ring-4', 'ring-white'));\n                    btn.classList.add('ring-4', 'ring-white');\n                    carColor = parseInt(btn.getAttribute('data-color'));\n                    if (car) {\n                        scene.remove(car);\n                        createDetailedSportsCar();\n                    }\n                });\n            });\n        }\n\n        function onWindowResize() {\n            camera.aspect = window.innerWidth / window.innerHeight;\n            camera.updateProjectionMatrix();\n            renderer.setSize(window.innerWidth, window.innerHeight);\n        }\n\n        window.onload = init;\n    <\/script>\n<\/body>\n<\/html>"}, {"id": "turbo", "title": "Turbo Racer", "desc": "3D otoyolda hızlı yarış, eğitim sürümü.", "emoji": "🏎️", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>3D Divided Highway Turbo Racer - Educational Edition<\/title>\n    <!-- Tailwind CSS -->\n    <script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n    <!-- Three.js Library -->\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n    <!-- Google Fonts -->\n    <link href=\"https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n    <style>\n        body {\n            font-family: 'Inter', sans-serif;\n            background-color: #030712;\n            color: #f8fafc;\n            overflow: hidden;\n            touch-action: none;\n            user-select: none;\n        }\n        .font-arcade {\n            font-family: 'Orbitron', sans-serif;\n        }\n        canvas {\n            display: block;\n            width: 100vw;\n            height: 100vh;\n            position: fixed;\n            top: 0;\n            left: 0;\n            z-index: 0;\n        }\n        .glow-text {\n            text-shadow: 0 0 20px rgba(59, 130, 246, 0.7), 0 0 40px rgba(147, 51, 234, 0.4);\n        }\n        .hud-panel {\n            background: rgba(15, 23, 42, 0.85);\n            backdrop-filter: blur(14px);\n            border: 1px solid rgba(255, 255, 255, 0.12);\n        }\n        .btn-arcade {\n            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);\n            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);\n            transition: all 0.15s ease;\n        }\n        .btn-arcade:hover {\n            transform: translateY(-2px);\n            box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.7);\n        }\n        .btn-quiz {\n            background: linear-gradient(135deg, #10b981 0%, #047857 100%);\n            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);\n            transition: all 0.15s ease;\n        }\n        .btn-quiz:hover {\n            transform: translateY(-2px);\n            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.7);\n        }\n        .speed-lines {\n            position: absolute;\n            inset: 0;\n            pointer-events: none;\n            background: radial-gradient(circle, transparent 55%, rgba(0,0,0,0.85) 100%);\n            opacity: 0;\n            transition: opacity 0.3s;\n        }\n        .speed-lines.active {\n            opacity: 0.65;\n        }\n        .turbo-glow {\n            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);\n        }\n    <\/style>\n<\/head>\n<body>\n\n    <div id=\"canvas-container\"><\/div>\n    <div id=\"speedLines\" class=\"speed-lines\"><\/div>\n\n    <!-- HUD Overlay -->\n    <div id=\"hud\" class=\"absolute top-0 left-0 w-full p-6 flex justify-between items-center z-10 pointer-events-none hidden\">\n        <div class=\"hud-panel px-6 py-3 rounded-2xl flex items-center space-x-6 shadow-2xl\">\n            <div>\n                <p class=\"text-xs text-slate-400 font-arcade uppercase tracking-wider\">Score<\/p>\n                <p id=\"scoreDisplay\" class=\"text-3xl font-black font-arcade text-blue-400\">0<\/p>\n            <\/div>\n            <div class=\"h-8 w-px bg-slate-700\"><\/div>\n            <div>\n                <p class=\"text-xs text-slate-400 font-arcade uppercase tracking-wider\">Speed<\/p>\n                <p class=\"text-3xl font-black font-arcade text-emerald-400\"><span id=\"speedDisplay\">80<\/span> <span class=\"text-sm font-normal text-slate-400\">km/h<\/span><\/p>\n            <\/div>\n            <div class=\"h-8 w-px bg-slate-700\"><\/div>\n            <div>\n                <p class=\"text-xs text-rose-400 font-arcade uppercase tracking-wider\">Turbo Energy<\/p>\n                <div class=\"w-28 bg-slate-800 h-3 rounded-full overflow-hidden mt-1 border border-rose-500/30\">\n                    <div id=\"turboBar\" class=\"bg-rose-500 h-full w-full transition-all duration-100 turbo-glow\"><\/div>\n                <\/div>\n            <\/div>\n        <\/div>\n        \n        <div class=\"flex items-center space-x-4 pointer-events-auto\">\n            <button id=\"openQuizBtn\" class=\"hud-panel px-5 py-3 rounded-2xl font-arcade font-bold text-emerald-400 hover:bg-emerald-500/10 border-emerald-500/30 flex items-center space-x-2 shadow-2xl transition\">\n                <svg class=\"w-5 h-5 text-emerald-400\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z\"><\/path><\/svg>\n                <span>TRAFFIC QUIZ 🚦<\/span>\n            <\/button>\n            <div class=\"hud-panel px-5 py-3 rounded-2xl text-right shadow-2xl pointer-events-none\">\n                <p class=\"text-xs text-slate-400 font-arcade uppercase tracking-wider\">High Score<\/p>\n                <p id=\"highScoreDisplay\" class=\"text-xl font-bold font-arcade text-amber-400\">0<\/p>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <!-- Touch Controls for Mobile/Tablet -->\n    <div id=\"touchControls\" class=\"absolute bottom-6 left-0 w-full px-6 flex justify-between items-center z-10 pointer-events-auto hidden\">\n        <div class=\"flex space-x-4\">\n            <button id=\"btnLeft\" class=\"w-20 h-20 bg-slate-800/80 backdrop-blur border border-white/20 rounded-full flex items-center justify-center text-3xl active:bg-blue-600 active:scale-95 transition shadow-2xl text-white\">◀<\/button>\n            <button id=\"btnRight\" class=\"w-20 h-20 bg-slate-800/80 backdrop-blur border border-white/20 rounded-full flex items-center justify-center text-3xl active:bg-blue-600 active:scale-95 transition shadow-2xl text-white\">▶<\/button>\n        <\/div>\n        <div class=\"flex space-x-4\">\n            <button id=\"btnBrake\" class=\"w-16 h-16 bg-blue-900/60 backdrop-blur border border-blue-500/40 rounded-full flex items-center justify-center text-xs font-bold font-arcade active:bg-blue-500 active:scale-95 transition shadow-2xl text-blue-200\">BRAKE<\/button>\n            <button id=\"btnTurbo\" class=\"w-20 h-20 bg-rose-600/80 backdrop-blur border border-rose-400/40 rounded-full flex items-center justify-center text-xs font-black font-arcade active:bg-rose-500 active:scale-95 transition shadow-2xl text-white\">TURBO<\/button>\n        <\/div>\n    <\/div>\n\n    <!-- Main Menu Modal -->\n    <div id=\"menuScreen\" class=\"absolute inset-0 flex items-center justify-center z-20 bg-slate-950/85 backdrop-blur-md\">\n        <div class=\"hud-panel p-10 rounded-3xl max-w-lg w-full text-center shadow-2xl border border-white/10 mx-4\">\n            <div class=\"inline-block p-4 bg-blue-500/10 rounded-2xl mb-6 border border-blue-500/20\">\n                <svg class=\"w-16 h-16 text-blue-500 mx-auto\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                    <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M13 10V3L4 14h7v7l9-11h-7z\"><\/path>\n                <\/svg>\n            <\/div>\n            <h1 class=\"text-4xl font-black font-arcade text-white mb-2 glow-text tracking-wider\">DIVIDED HIGHWAY<\/h1>\n            <p class=\"text-slate-400 mb-6 text-sm\">Left 2 Lanes: Oncoming Traffic | Right 2 Lanes: Same Direction Traffic<\/p>\n            \n            <div class=\"bg-slate-900/60 p-4 rounded-2xl mb-8 border border-white/5 text-left space-y-2\">\n                <p class=\"text-xs text-slate-400 font-arcade uppercase font-semibold\">Game Controls<\/p>\n                <div class=\"flex justify-between items-center text-sm text-slate-300\">\n                    <span>Lane Switch<\/span>\n                    <span class=\"px-2 py-1 bg-slate-800 rounded text-xs font-mono border border-slate-700\">A / D or ◄ / ►<\/span>\n                <\/div>\n                <div class=\"flex justify-between items-center text-sm text-slate-300\">\n                    <span>Turbo Speed Up<\/span>\n                    <span class=\"px-2 py-1 bg-slate-800 rounded text-xs font-mono border border-slate-700\">Left Shift ⇧<\/span>\n                <\/div>\n                <div class=\"flex justify-between items-center text-sm text-slate-300\">\n                    <span>Brake / Slow Down<\/span>\n                    <span class=\"px-2 py-1 bg-slate-800 rounded text-xs font-mono border border-slate-700\">Spacebar<\/span>\n                <\/div>\n            <\/div>\n\n            <div class=\"space-y-4\">\n                <button id=\"startBtn\" class=\"w-full py-4 rounded-2xl btn-arcade text-white font-black font-arcade text-lg tracking-wider shadow-lg flex items-center justify-center space-x-2\">\n                    <span>START RACE<\/span>\n                    <svg class=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M14 5l7 7m0 0l-7 7m7-7H3\"><\/path><\/svg>\n                <\/button>\n                <button id=\"menuQuizBtn\" class=\"w-full py-4
